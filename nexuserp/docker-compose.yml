services:
  sistema-nexuserp-php:
    image: sistema-nexuserp-php
    container_name: sistema-nexuserp-php
    build: .
    ports:
      - "8080:80"
    networks:
      - red-external-network
    restart: always
    env_file:
      - .env
    volumes:
      # .env del host (para cambiar config sin rebuild)
      - ./.env:/var/www/nexuserp/.env
      # Persistencia de logs/sessions/cache de Laravel entre rebuilds
      - sistema-nexuserp-storage:/var/www/nexuserp/storage

volumes:
  sistema-nexuserp-storage:

networks:
  red-external-network:
    external: true
