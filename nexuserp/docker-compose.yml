services:

  # ── Aplicación Laravel ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: nexuserp
        uid: 1000
    image: nexuserp-app
    container_name: nexuserp_app
    restart: unless-stopped
    working_dir: /var/www/nexuserp
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/nexuserp/storage
      - ./bootstrap/cache:/var/www/nexuserp/bootstrap/cache
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - nexuserp_net

  # ── Queue Worker (opcional, puedes comentar si no lo usas) ───
  queue:
    image: nexuserp-app
    pull_policy: never
    container_name: nexuserp_queue
    restart: unless-stopped
    working_dir: /var/www/nexuserp
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - ./:/var/www/nexuserp
      - ./storage:/var/www/nexuserp/storage
    depends_on:
      - app
    networks:
      - nexuserp_net

  # ── Scheduler (opcional, puedes comentar si no lo usas) ──────
  scheduler:
    image: nexuserp-app
    container_name: nexuserp_scheduler
    restart: unless-stopped
    working_dir: /var/www/nexuserp
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    env_file:
      - .env
    volumes:
      - ./:/var/www/nexuserp
      - ./storage:/var/www/nexuserp/storage
    depends_on:
      - app
    networks:
      - nexuserp_net

networks:
  nexuserp_net:
    driver: bridge